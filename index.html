    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    color:var(--ink);
    font-family:'Nanum Myeongjo', serif;
    min-height:100vh;
    position:relative;
  }
  body::after{
    content:'';
    position:fixed; inset:0; pointer-events:none; z-index:0;
    box-shadow: inset 0 0 100px rgba(20,12,4,0.22);
  }
  .app{max-width:720px; margin:0 auto; padding:36px 20px 90px; position:relative; z-index:1;}

  header{text-align:center; margin-bottom:30px;}
  header h1{font-family:'Pinyon Script', cursive; font-weight:400; font-size:4.2rem; margin:0 0 8px; line-height:1; color:var(--seal); text-shadow:0 1px 0 rgba(255,255,255,0.15);}
  header p{color:var(--muted); font-size:0.92rem; margin:12px 0 0;}

  .ornament{display:flex; align-items:center; justify-content:center; gap:10px;}
  .ornament span{width:44px; height:1px; background:var(--muted); opacity:0.6;}
  .ornament i{width:6px; height:6px; background:var(--seal); transform:rotate(45deg); display:block;}

  .add-card{
    background:var(--card);
    border:1px solid rgba(107,68,35,0.25);
    border-radius:10px;
    padding:24px 20px 20px;
    box-shadow:var(--shadow);
    position:relative;
    margin-bottom:36px;
  }
  .add-card::before{
    content:'';
    position:absolute;
    top:-10px; left:50%; transform:translateX(-50%);
    width:18px; height:18px; border-radius:50%;
    background:var(--seal);
    box-shadow: inset -2px -2px 3px rgba(0,0,0,0.3), 0 2px 5px rgba(0,0,0,0.35);
  }
  .add-row{display:flex; flex-wrap:wrap; gap:10px; margin-bottom:12px;}
  .field-year{flex:0 0 110px;}
  .field-event{flex:1; min-width:180px;}

  input[type="text"]{
    width:100%;
    border:1px solid rgba(107,68,35,0.35);
    border-radius:6px;
    padding:10px 12px;
    font-family:'Nanum Myeongjo', serif;
    font-size:0.95rem;
    background:var(--paper);
    color:var(--ink);
    transition:border-color .15s;
    touch-action:manipulation;
  }
  input::placeholder{color:var(--muted); opacity:0.8;}
  input:focus{outline:none; border-color:var(--seal);}
  input:focus-visible{outline:2px solid var(--seal); outline-offset:1px;}

  .add-bottom-row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .hint{font-size:0.78rem; color:var(--muted);}
  .hint.error{color:var(--seal); font-weight:700;}

  button{font-family:'Nanum Myeongjo', serif; cursor:pointer; border:none; touch-action:manipulation;}
  button:focus-visible{outline:2px solid var(--seal); outline-offset:2px;}

  .add-btn{
    background:var(--spine); color:var(--card); font-weight:700;
    border:1px solid var(--gold);
    border-radius:6px; padding:11px 26px; font-size:0.95rem;
    letter-spacing:1px;
    box-shadow:0 3px 0 rgba(0,0,0,0.15);
    transition:transform .12s;
    flex-shrink:0;
  }
  .add-btn:hover{transform:translateY(-1px);}
  .add-btn:active{transform:translateY(1px);}

  .section-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:6px; padding:0 4px;}
  .section-head h2{font-weight:700; font-size:1.3rem; margin:0; letter-spacing:1px;}
  .count{font-size:0.82rem; color:var(--muted);}
  .section-hint{font-size:0.78rem; color:var(--muted); margin:0 4px 18px;}

  .banner{
    display:none;
    background:#F3E0B8; color:#5C3A12; border:1px solid rgba(107,68,35,0.4);
    border-radius:8px; padding:10px 14px; font-size:0.82rem;
    margin-bottom:20px; line-height:1.6;
  }
  .banner.show{display:block;}

  .search-row{margin-bottom:18px;}
  .search-row input{width:100%;}

  .timeline-list{position:relative; padding:4px 0;}
  .timeline-list::before{
    content:'';
    position:absolute;
    left:21px; top:4px; bottom:4px; width:2px;
    background:repeating-linear-gradient(to bottom, var(--spine) 0 8px, transparent 8px 16px);
    border-radius:2px;
  }

  .event-row{display:flex; gap:13px; align-items:flex-start; position:relative; margin-bottom:16px;}
  .event-row:last-child{margin-bottom:0;}

  .year-badge{
    flex:0 0 44px; width:44px; height:44px; border-radius:50%;
    background:var(--card); border:2px solid var(--spine);
    display:flex; align-items:center; justify-content:center;
    box-shadow:var(--shadow); position:relative; z-index:1;
  }
  .year-badge .num{font-weight:800; font-size:0.86rem; line-height:1;}

  .card{
    flex:1; background:var(--card); border-radius:6px;
    border-top:2px solid var(--seal);
    padding:11px 14px 10px; box-shadow:var(--shadow);
    position:relative; min-width:0;
  }

  .card .event-name{font-weight:700; font-size:0.9rem; word-break:keep-all; padding-right:26px;}
  .card .event-year-label{font-size:0.68rem; color:var(--muted); margin-top:2px;}
  .card .event-category{display:inline-flex; align-items:center; gap:5px; font-size:0.66rem; color:var(--muted); margin-top:5px;}
  .card .event-category .dot{width:7px; height:7px; border-radius:50%; flex-shrink:0;}

  .card-actions{position:absolute; top:8px; right:8px; display:flex; gap:6px;}
  .del-btn{
    width:19px; height:19px; border-radius:50%;
    background:var(--paper-2); color:var(--muted);
    font-size:0.78rem; line-height:1; display:flex; align-items:center; justify-content:center;
    opacity:0.65; transition:opacity .12s, background .12s, color .12s;
  }
  .del-btn:hover, .del-btn:focus-visible{opacity:1; background:var(--seal); color:var(--card);}

  .empty-state{
    text-align:center; padding:44px 20px;
    border:1px dashed rgba(107,68,35,0.35); border-radius:10px;
    color:var(--muted);
  }
  .empty-state .ornament{margin-bottom:14px;}
  .empty-state p{margin:0; font-size:0.92rem; line-height:1.7;}

  .menu-btn{
    position:fixed; top:16px; right:16px; z-index:150;
    width:42px; height:42px; border-radius:50%;
    background:var(--card); border:1px solid rgba(107,68,35,0.35);
    box-shadow:var(--shadow);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
  }
  .menu-btn span{width:18px; height:2px; background:var(--ink); display:block;}
  .game-start-btn{
    display:block; width:100%;
    background:var(--spine); color:var(--card); border:1px solid var(--gold);
    border-radius:6px; padding:13px; font-size:0.95rem; font-weight:700; letter-spacing:1px;
  }
  .game-start-btn:hover{transform:translateY(-1px);}

  .game-overlay{
    display:none; position:fixed; inset:0; background:rgba(20,12,4,0.55);
    z-index:200; align-items:center; justify-content:center; padding:20px;
  }
  .game-overlay.show{display:flex;}
  .game-modal{
    background:var(--card); border-radius:10px; border:1px solid rgba(107,68,35,0.3);
    box-shadow:0 12px 40px rgba(0,0,0,0.4);
    max-width:420px; width:100%; max-height:85vh; overflow-y:auto;
    padding:24px 22px;
  }
  .game-modal h3{margin:0 0 16px; font-size:1.15rem; text-align:center;}

  .game-mode-list{display:flex; flex-direction:column; gap:8px; margin-bottom:16px;}
  .game-mode-btn{
    display:flex; align-items:center; gap:8px; width:100%;
    background:var(--paper); border:1px solid rgba(107,68,35,0.3); border-radius:6px;
    padding:11px 14px; font-size:0.9rem; text-align:left;
  }
  .game-mode-btn:hover{background:var(--paper-2);}
  .game-mode-btn .mode-dot{width:9px; height:9px; border-radius:50%; flex-shrink:0; background:var(--spine);}
  .game-mode-btn .mode-label{flex:1; font-weight:700;}
  .game-mode-btn .mode-count{font-size:0.78rem; color:var(--muted);}
  .game-empty{font-size:0.85rem; color:var(--muted); text-align:center; padding:16px 4px; line-height:1.7;}

  .game-progress{font-size:0.78rem; color:var(--muted); text-align:center; margin-bottom:14px;}
  .game-question-card{
    background:var(--paper); border:1px solid rgba(107,68,35,0.25); border-radius:8px;
    padding:22px 16px; text-align:center; font-size:1.1rem; font-weight:700;
    margin-bottom:18px; line-height:1.5;
  }
  .game-options{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px;}
  .game-option-btn{
    background:var(--paper); border:2px solid rgba(107,68,35,0.3); border-radius:8px;
    padding:14px 8px; font-size:1rem; font-weight:800; text-align:center;
  }
  .game-option-btn:hover{border-color:var(--spine);}
  .game-option-btn.correct{background:#3F5D3A; border-color:#3F5D3A; color:#fff;}
  .game-option-btn.wrong{background:var(--seal); border-color:var(--seal); color:#fff;}
  .game-option-btn:disabled{cursor:default;}
  .game-feedback{text-align:center; font-size:0.9rem; font-weight:700; min-height:1.4em; margin-bottom:6px;}
  .game-feedback.correct{color:#3F5D3A;}
  .game-feedback.wrong{color:var(--seal);}

  .game-next-btn, .game-again-btn{
    display:block; width:100%; background:var(--spine); color:var(--card); border:1px solid var(--gold);
    border-radius:6px; padding:11px; font-size:0.9rem; font-weight:700; margin-top:6px;
  }
  .game-close-btn{
    display:block; width:100%; background:transparent; color:var(--muted); border:1px solid rgba(107,68,35,0.3);
    border-radius:6px; padding:10px; font-size:0.85rem; margin-top:8px;
  }
  .game-score{text-align:center; font-size:1.5rem; font-weight:800; margin:6px 0 6px;}
  .game-score-sub{text-align:center; font-size:0.85rem; color:var(--muted); margin-bottom:18px;}

  /* 카테고리 전용화면 */
  .cat-add-new{display:flex; gap:8px; margin-bottom:16px;}
  .cat-add-new input{flex:1; font-size:0.85rem; padding:9px 11px;}
  .cat-add-new .cat-year-narrow{flex:0 0 70px;}
  .cat-add-new button{
    background:var(--spine); color:var(--card); border:1px solid var(--gold);
    border-radius:6px; padding:9px 14px; font-size:0.82rem; font-weight:700; flex-shrink:0;
  }

  .cat-board-wrap{position:relative;}
  .string-layer{position:absolute; top:0; left:0; pointer-events:none; overflow:visible;}
  .label-layer{position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none;}
  .string-tag{
    position:absolute; transform:translate(-50%,-50%) rotate(-1.5deg);
    background:var(--card); color:var(--ink); font-size:0.66rem; font-weight:700;
    padding:3px 9px; border-radius:3px; border:1px solid var(--seal);
    box-shadow:var(--shadow);
    pointer-events:auto; cursor:pointer; white-space:nowrap;
    max-width:120px; overflow:hidden; text-overflow:ellipsis;
    transition:background .12s, color .12s;
  }
  .string-tag:hover{background:var(--seal); color:var(--card);}

  .cat-connect-toggle{
    display:block; width:100%; margin-bottom:14px;
    background:var(--paper); border:1px solid rgba(107,68,35,0.3); color:var(--ink);
    border-radius:6px; padding:9px; font-size:0.85rem; font-weight:700;
  }
  .cat-connect-toggle.active{background:var(--seal); border-color:var(--seal); color:var(--card);}

  .cat-board-list{position:relative; display:flex; flex-direction:column; gap:10px; width:calc(100% - 46px);}
  .cat-row{
    display:flex; align-items:center; gap:8px;
    background:var(--paper); border:1px solid rgba(107,68,35,0.3); border-radius:6px;
    padding:12px 14px; cursor:pointer;
  }
  .cat-row:hover{background:var(--paper-2);}
  .cat-row.linking-from{outline:2px dashed var(--seal); outline-offset:2px;}
  .cat-row-dot{width:10px; height:10px; border-radius:50%; flex-shrink:0;}
  .cat-row-name{flex:1; font-weight:700; font-size:0.92rem;}
  .cat-board-empty{font-size:0.85rem; color:var(--muted); text-align:center; padding:16px 4px; line-height:1.7;}
  .cat-delete-category-btn{
    display:block; width:100%; background:transparent; color:var(--seal); border:1px solid var(--seal);
    border-radius:6px; padding:9px; font-size:0.82rem; font-weight:700; margin-top:14px;
  }
  .cat-delete-category-btn:hover{background:var(--seal); color:var(--card);}

  .cat-detail-head{margin-bottom:6px;}
  .cat-back-btn{background:transparent; color:var(--muted); font-size:0.82rem; padding:4px 0;}
  .cat-back-btn:hover{color:var(--ink);}
  .cat-detail-title{display:flex; align-items:center; gap:8px; font-size:1.15rem; margin:4px 0 18px; font-weight:700;}
  .cat-detail-title .cat-row-dot{width:12px; height:12px;}
  .cat-detail-list{display:flex; flex-direction:column; gap:6px; margin-top:16px; max-height:260px; overflow-y:auto;}
  .cat-detail-item{
    display:flex; align-items:center; gap:10px;
    background:var(--paper); border:1px solid rgba(107,68,35,0.2); border-radius:6px;
    padding:8px 10px;
  }
  .cat-detail-year{font-weight:800; font-size:0.82rem; flex-shrink:0; width:52px;}
  .cat-detail-name{flex:1; font-size:0.88rem; word-break:keep-all;}
  .cat-detail-del{
    width:19px; height:19px; border-radius:50%; background:var(--paper-2); color:var(--muted);
    display:flex; align-items:center; justify-content:center; font-size:0.75rem; opacity:0.6; flex-shrink:0;
  }
  .cat-detail-del:hover{opacity:1; background:var(--seal); color:var(--card);}
  .cat-detail-empty{font-size:0.82rem; color:var(--muted); text-align:center; padding:14px;}

  .link-bar{
    position:fixed; left:50%; bottom:22px; transform:translateX(-50%);
    background:var(--ink); color:var(--card);
    padding:10px 14px; border-radius:8px;
    display:none; align-items:center; gap:8px; flex-wrap:wrap; justify-content:center;
    box-shadow:0 6px 20px rgba(0,0,0,0.35);
    z-index:250; max-width:92vw;
  }
  .link-bar.show{display:flex;}
  .link-bar span{font-size:0.82rem; white-space:nowrap;}
  .link-bar input{
    border:none; border-radius:5px; padding:7px 12px; font-size:0.82rem;
    width:150px; font-family:'Nanum Myeongjo', serif; touch-action:manipulation;
  }
  .link-bar input:focus{outline:2px solid var(--gold);}
  .link-bar button{border-radius:5px; padding:7px 14px; font-size:0.8rem; font-weight:700; white-space:nowrap;}
  .link-bar .confirm-btn{background:var(--seal); color:var(--card);}
  .link-bar .cancel-btn{background:rgba(255,255,255,0.15); color:var(--card);}

  @media (max-width:420px){
    header h1{font-size:3.2rem;}
    .link-bar input{width:120px;}
  }
  @media (prefers-reduced-motion: reduce){
    * {transition:none !important;}
  }
</style>
</head>
<body>
  <div class="app">
    <header>
      <h1>History</h1>
      <div class="ornament" aria-hidden="true"><span></span><i></i><span></span></div>
      <p>년도와 사건을 적으면 자동으로 시간 순서대로 정리돼요</p>
    </header>

    <div class="banner" id="saveBanner"></div>

    <form class="add-card" id="addForm">
      <div class="add-row">
        <div class="field-year">
          <input type="text" id="yearInput" placeholder="연도" aria-label="연도" inputmode="numeric" pattern="[0-9]*" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        </div>
        <div class="field-event">
          <input type="text" id="eventInput" placeholder="사건 이름 (예: 조선 건국)" aria-label="사건 이름" maxlength="60" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        </div>
      </div>
      <div class="add-bottom-row">
        <span class="hint" id="hintText">연도 → 사건 이름 순서로 입력해요</span>
        <button type="submit" class="add-btn">기록 추가</button>
      </div>
    </form>

    <div class="section-head">
      <h2>타임라인</h2>
      <span class="count" id="countText"></span>
    </div>
    <div class="search-row">
      <input type="text" id="searchInput" placeholder="사건 이름으로 검색해서 연도 찾기" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    </div>

    <div id="mainArea">
      <div class="loading">불러오는 중...</div>
    </div>
  </div>

  <button type="button" class="menu-btn" id="menuBtn" aria-label="메뉴">
    <span></span><span></span><span></span>
  </button>

  <div class="link-bar" id="linkBar">
    <span id="linkBarText">연결할 카테고리를 선택하세요</span>
    <input type="text" id="linkLabelInput" placeholder="관계 (예: 대립 관계)" style="display:none;">
    <button type="button" class="confirm-btn" id="linkConfirmBtn" style="display:none;">연결하기</button>
    <button type="button" class="cancel-btn" id="linkCancelBtn">취소</button>
  </div>

  <div class="game-overlay" id="menuOverlay">
    <div class="game-modal" id="menuModalBox">
      <h3>메뉴</h3>
      <div class="game-mode-list">
        <button type="button" class="game-mode-btn" id="menuGameBtn"><span class="mode-label">게임</span></button>
        <button type="button" class="game-mode-btn" id="menuCategoryBtn"><span class="mode-label">카테고리</span></button>
      </div>
      <button type="button" class="game-close-btn" id="menuCloseBtn">닫기</button>
    </div>
  </div>

  <div class="game-overlay" id="gameOverlay">
    <div class="game-modal" id="gameModal"></div>
  </div>

  <div class="game-overlay" id="categoryOverlay">
    <div class="game-modal" id="categoryModalBox"></div>
  </div>

<script>
(function(){
  const SVG_NS = 'http://www.w3.org/2000/svg';
  const STORAGE_KEY = 'history-timeline-data';
  const LINK_ICON = '<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 15L15 9"></path><path d="M10 6.5l1-1a4 4 0 0 1 5.5 5.5l-1 1"></path><path d="M14 17.5l-1 1a4 4 0 0 1-5.5-5.5l1-1"></path></svg>';
  const CATEGORY_COLORS = ['#8B2318','#3F5D3A','#2E4057','#A9812E','#5C3A5C','#4A5D6B'];

  let events = [];
  let categories = [];
  let categoryConnections = [];

  // 카테고리 화면 상태
  let categoryScreen = 'board'; // 'board' | 'detail'
  let categoryDetailId = null;
  let catLinkFromId = null;
  let catLinkToId = null;
  let catConnectMode = false;

  let gameState = null;
  let searchQuery = '';

  const mainArea = document.getElementById('mainArea');
  const countText = document.getElementById('countText');
  const addForm = document.getElementById('addForm');
  const yearInput = document.getElementById('yearInput');
  const eventInput = document.getElementById('eventInput');
  const hintText = document.getElementById('hintText');
  const saveBanner = document.getElementById('saveBanner');
  const searchInput = document.getElementById('searchInput');

  const menuBtn = document.getElementById('menuBtn');
  const menuOverlay = document.getElementById('menuOverlay');
  const menuGameBtn = document.getElementById('menuGameBtn');
  const menuCategoryBtn = document.getElementById('menuCategoryBtn');
  const menuCloseBtn = document.getElementById('menuCloseBtn');

  const categoryOverlay = document.getElementById('categoryOverlay');
  const categoryModalBox = document.getElementById('categoryModalBox');

  const gameOverlay = document.getElementById('gameOverlay');
  const gameModal = document.getElementById('gameModal');

  const linkBar = document.getElementById('linkBar');
  const linkBarText = document.getElementById('linkBarText');
  const linkLabelInput = document.getElementById('linkLabelInput');
  const linkConfirmBtn = document.getElementById('linkConfirmBtn');
  const linkCancelBtn = document.getElementById('linkCancelBtn');

  addForm.addEventListener('submit', function(e){
    e.preventDefault();
    handleAddSubmit();
  });

  searchInput.addEventListener('input', function(){
    searchQuery = searchInput.value;
    render();
  });

  menuBtn.addEventListener('click', function(){ menuOverlay.classList.add('show'); });
  menuOverlay.addEventListener('click', function(e){
    if(e.target === menuOverlay) menuOverlay.classList.remove('show');
  });
  menuCloseBtn.addEventListener('click', function(){ menuOverlay.classList.remove('show'); });
  menuGameBtn.addEventListener('click', function(){ menuOverlay.classList.remove('show'); openGame(); });
  menuCategoryBtn.addEventListener('click', function(){ menuOverlay.classList.remove('show'); openCategoryModal(); });

  categoryOverlay.addEventListener('click', function(e){
    if(e.target === categoryOverlay) closeCategoryModal();
  });

  gameOverlay.addEventListener('click', function(e){
    if(e.target === gameOverlay) closeGame();
  });

  linkCancelBtn.addEventListener('click', function(){ resetCategoryLinking(); });
  linkConfirmBtn.addEventListener('click', function(){ handleCategoryLinkConfirm(); });
  linkLabelInput.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ e.preventDefault(); linkConfirmBtn.click(); }
  });

  window.addEventListener('resize', function(){
    clearTimeout(window.__catResizeTimer);
    window.__catResizeTimer = setTimeout(function(){
      if(categoryOverlay.classList.contains('show') && categoryScreen === 'board' && categoryConnections.length > 0){
        drawCategoryStrings();
      }
    }, 150);
  });

  function yearLabel(ev){ return ev.year + '년'; }

  function showBanner(msg){
    saveBanner.textContent = msg;
    saveBanner.classList.add('show');
  }
  function hideBanner(){
    saveBanner.classList.remove('show');
  }

  function loadData(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        const parsed = JSON.parse(raw);
        if(Array.isArray(parsed)){
          events = parsed;
          categories = [];
          categoryConnections = [];
        } else if(parsed && typeof parsed === 'object'){
          events = Array.isArray(parsed.events) ? parsed.events : [];
          categories = Array.isArray(parsed.categories) ? parsed.categories : [];
          categoryConnections = Array.isArray(parsed.categoryConnections) ? parsed.categoryConnections : [];
        }
      }
    }catch(e){
      showBanner('※ 저장된 기록을 불러오지 못했어요 (브라우저 저장 기능이 꺼져있을 수 있어요).');
    }
  }

  function saveData(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify({events, categories, categoryConnections}));
      hideBanner();
    }catch(e){
      showBanner('※ 저장에 실패했어요: ' + (e && e.message ? e.message : '알 수 없는 오류'));
    }
  }

  function shuffle(arr){
    const a = [...arr];
    for(let i = a.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // ---------- 메인 타임라인 ----------

  function handleAddSubmit(){
    const yearRaw = yearInput.value.trim();
    const name = eventInput.value.trim();

    if(!yearRaw || !name){
      hintText.textContent = '연도와 사건 이름을 모두 입력해주세요';
      hintText.classList.add('error');
      return;
    }
    if(!/^\d+$/.test(yearRaw)){
      hintText.textContent = '연도는 숫자만 입력해주세요';
      hintText.classList.add('error');
      return;
    }
    const year = parseInt(yearRaw, 10);

    hintText.textContent = '연도 → 사건 이름 순서로 입력해요';
    hintText.classList.remove('error');

    events.push({
      id: Date.now() + '-' + Math.random().toString(36).slice(2,7),
      year: year,
      name: name
    });

    render();

    eventInput.value = '';
    yearInput.value = '';
    yearInput.focus();

    saveData();
  }

  function deleteEvent(id){
    events = events.filter(ev => ev.id !== id);
    render();
    saveData();
    if(categoryOverlay.classList.contains('show') && categoryScreen === 'detail'){
      renderCategoryDetail(categoryDetailId);
    }
  }

  function render(){
    const q = searchQuery.trim().toLowerCase();
    let sorted = [...events].sort((a,b) => a.year - b.year);
    if(q) sorted = sorted.filter(ev => ev.name.toLowerCase().includes(q));

    if(q){
      countText.textContent = `검색 결과 ${sorted.length}개`;
    } else {
      countText.textContent = events.length > 0 ? `총 ${events.length}개의 사건` : '';
    }

    if(sorted.length === 0){
      const empty = document.createElement('div');
      empty.className = 'empty-state';
      const orn = document.createElement('div');
      orn.className = 'ornament';
      orn.setAttribute('aria-hidden', 'true');
      orn.innerHTML = '<span></span><i></i><span></span>';
      const p = document.createElement('p');
      if(q){
        p.textContent = `"${searchQuery.trim()}"와 일치하는 사건을 찾지 못했어요.`;
      } else {
        p.innerHTML = '아직 기록된 사건이 없어요.<br>위에서 첫 번째 역사적 사건을 추가해보세요.';
      }
      empty.appendChild(orn);
      empty.appendChild(p);
      mainArea.innerHTML = '';
      mainArea.appendChild(empty);
      return;
    }

    const list = document.createElement('div');
    list.className = 'timeline-list';

    sorted.forEach((ev) => {
      const row = document.createElement('div');
      row.className = 'event-row';
      row.dataset.id = ev.id;

      const badge = document.createElement('div');
      badge.className = 'year-badge';
      badge.innerHTML = `<span class="num">${ev.year}</span>`;

      const card = document.createElement('div');
      card.className = 'card';

      const cat = ev.categoryId ? categories.find(c => c.id === ev.categoryId) : null;
      if(cat) card.style.borderTopColor = cat.color;

      const actions = document.createElement('div');
      actions.className = 'card-actions';

      const del = document.createElement('button');
      del.type = 'button';
      del.className = 'del-btn';
      del.setAttribute('aria-label', `${ev.name} 삭제`);
      del.textContent = '×';
      del.addEventListener('click', () => deleteEvent(ev.id));
      actions.appendChild(del);

      const name = document.createElement('div');
      name.className = 'event-name';
      name.textContent = ev.name;

      const yl = document.createElement('div');
      yl.className = 'event-year-label';
      yl.textContent = yearLabel(ev);

      card.appendChild(actions);
      card.appendChild(name);
      card.appendChild(yl);

      if(cat){
        const catTag = document.createElement('div');
        catTag.className = 'event-category';
        catTag.innerHTML = `<span class="dot" style="background:${cat.color}"></span>${cat.name}`;
        card.appendChild(catTag);
      }

      row.appendChild(badge);
      row.appendChild(card);
      list.appendChild(row);
    });

    mainArea.innerHTML = '';
    mainArea.appendChild(list);
  }

  // ---------- 카테고리 전용화면 ----------

  function openCategoryModal(){
    categoryScreen = 'board';
    categoryDetailId = null;
    catConnectMode = false;
    categoryOverlay.classList.add('show');
    renderCategoryModal();
  }

  function closeCategoryModal(){
    categoryOverlay.classList.remove('show');
    catConnectMode = false;
    resetCategoryLinking();
  }

  function handleAddCategory(nameInput){
    const name = nameInput.value.trim();
    if(!name) return;
    categories.push({
      id: Date.now() + '-' + Math.random().toString(36).slice(2,7),
      name: name,
      color: CATEGORY_COLORS[categories.length % CATEGORY_COLORS.length]
    });
    nameInput.value = '';
    renderCategoryModal();
    render();
    saveData();
  }

  function deleteCategory(id){
    categories = categories.filter(c => c.id !== id);
    categoryConnections = categoryConnections.filter(cc => cc.fromId !== id && cc.toId !== id);
    events.forEach(ev => { if(ev.categoryId === id) ev.categoryId = null; });
    if(categoryDetailId === id){
      categoryScreen = 'board';
      categoryDetailId = null;
    }
    if(catLinkFromId === id || catLinkToId === id) resetCategoryLinking();
    renderCategoryModal();
    render();
    saveData();
  }

  function addCategoryEvent(categoryId, yearRaw, nameRaw){
    const yearTrim = (yearRaw || '').trim();
    const nameTrim = (nameRaw || '').trim();
    if(!yearTrim || !nameTrim || !/^\d+$/.test(yearTrim)) return;
    events.push({
      id: Date.now() + '-' + Math.random().toString(36).slice(2,7),
      year: parseInt(yearTrim, 10),
      name: nameTrim,
      categoryId: categoryId
    });
    render();
    saveData();
    renderCategoryModal();
  }

  function resetCategoryLinking(){
    catLinkFromId = null;
    catLinkToId = null;
    linkBar.classList.remove('show');
    linkLabelInput.style.display = 'none';
    linkConfirmBtn.style.display = 'none';
    linkBarText.textContent = '연결할 카테고리를 선택하세요';
    const highlighted = categoryModalBox.querySelector('.cat-row.linking-from');
    if(highlighted) highlighted.classList.remove('linking-from');
  }

  function handleCategoryConnectClick(id, rowEl){
    if(catLinkFromId === null){
      catLinkFromId = id;
      rowEl.classList.add('linking-from');
      linkBarText.textContent = '연결할 다른 카테고리를 선택하세요';
      linkLabelInput.style.display = 'none';
      linkConfirmBtn.style.display = 'none';
      linkBar.classList.add('show');
    } else if(catLinkFromId === id){
      resetCategoryLinking();
    } else {
      catLinkToId = id;
      linkBarText.textContent = '어떤 관계인가요?';
      linkLabelInput.style.display = 'inline-block';
      linkLabelInput.value = '';
      linkConfirmBtn.style.display = 'inline-block';
      linkBar.classList.add('show');
      linkLabelInput.focus();
    }
  }

  function handleCategoryLinkConfirm(){
    if(catLinkFromId === null || catLinkToId === null) return;
    categoryConnections.push({
      id: Date.now() + '-' + Math.random().toString(36).slice(2,7),
      fromId: catLinkFromId,
      toId: catLinkToId,
      label: linkLabelInput.value.trim()
    });
    resetCategoryLinking();
    renderCategoryModal();
    saveData();
  }

  function drawCategoryStrings(){
    const wrap = categoryModalBox.querySelector('.cat-board-wrap');
    if(!wrap) return;
    const svg = wrap.querySelector('.string-layer');
    const labelLayer = wrap.querySelector('.label-layer');
    const list = wrap.querySelector('.cat-board-list');
    if(!svg || !labelLayer || !list) return;

    const wrapRect = wrap.getBoundingClientRect();
    svg.setAttribute('width', wrapRect.width);
    svg.setAttribute('height', wrapRect.height);
    svg.setAttribute('viewBox', `0 0 ${wrapRect.width} ${wrapRect.height}`);
    svg.innerHTML = '';
    labelLayer.innerHTML = '';

    categoryConnections.forEach((conn, idx) => {
      const rowA = list.querySelector(`[data-id="${conn.fromId}"]`);
      const rowB = list.querySelector(`[data-id="${conn.toId}"]`);
      if(!rowA || !rowB) return;
      const rectA = rowA.getBoundingClientRect();
      const rectB = rowB.getBoundingClientRect();
      const p1 = { x: rectA.right - wrapRect.left, y: rectA.top - wrapRect.top + rectA.height/2 };
      const p2 = { x: rectB.right - wrapRect.left, y: rectB.top - wrapRect.top + rectB.height/2 };
      const bulge = 22 + (idx % 3) * 10;
      const c1x = p1.x + bulge, c2x = p2.x + bulge;

      const path = document.createElementNS(SVG_NS, 'path');
      path.setAttribute('d', `M ${p1.x} ${p1.y} C ${c1x} ${p1.y}, ${c2x} ${p2.y}, ${p2.x} ${p2.y}`);
      path.setAttribute('fill', 'none');
      path.setAttribute('stroke', '#8B2318');
      path.setAttribute('stroke-width', '1.6');
      path.setAttribute('stroke-linecap', 'round');
      path.setAttribute('opacity', '0.75');
      svg.appendChild(path);

      [p1, p2].forEach(p => {
        const dot = document.createElementNS(SVG_NS, 'circle');
        dot.setAttribute('cx', p.x);
        dot.setAttribute('cy', p.y);
        dot.setAttribute('r', '3.5');
        dot.setAttribute('fill', '#8B2318');
        svg.appendChild(dot);
      });

      const midX = (p1.x + p2.x) / 2 + bulge * 0.85;
      const midY = (p1.y + p2.y) / 2;
      const tag = document.createElement('div');
      tag.className = 'string-tag';
      tag.style.left = midX + 'px';
      tag.style.top = midY + 'px';
      tag.textContent = conn.label ? conn.label : '연결';
      tag.title = '클릭하면 연결 삭제';
      tag.addEventListener('click', () => {
        categoryConnections = categoryConnections.filter(c => c.id !== conn.id);
        renderCategoryModal();
        saveData();
      });
      labelLayer.appendChild(tag);
    });
  }

  function renderCategoryBoard(){
    categoryModalBox.innerHTML = '';

    const h3 = document.createElement('h3');
    h3.textContent = '카테고리';
    categoryModalBox.appendChild(h3);

    const addRow = document.createElement('div');
    addRow.className = 'cat-add-new';
    const nameInput = document.createElement('input');
    nameInput.type = 'text';
    nameInput.placeholder = '카테고리 이름 (예: 정치사)';
    nameInput.maxLength = 20;
    nameInput.autocomplete = 'off';
    const addBtn = document.createElement('button');
    addBtn.type = 'button';
    addBtn.textContent = '추가';
    addBtn.addEventListener('click', () => handleAddCategory(nameInput));
    nameInput.addEventListener('keydown', (e) => { if(e.key === 'Enter'){ e.preventDefault(); addBtn.click(); } });
    addRow.appendChild(nameInput);
    addRow.appendChild(addBtn);
    categoryModalBox.appendChild(addRow);

    if(categories.length === 0){
      const p = document.createElement('p');
      p.className = 'cat-board-empty';
      p.textContent = '카테고리를 추가해보세요. 이름을 눌러서 그 안의 사건들을 볼 수 있어요.';
      categoryModalBox.appendChild(p);
    } else {
      const toggle = document.createElement('button');
      toggle.type = 'button';
      toggle.className = 'cat-connect-toggle' + (catConnectMode ? ' active' : '');
      toggle.textContent = catConnectMode ? '연결 모드 끄기' : '연결하기';
      toggle.addEventListener('click', () => {
        catConnectMode = !catConnectMode;
        if(!catConnectMode) resetCategoryLinking();
        renderCategoryModal();
      });
      categoryModalBox.appendChild(toggle);

      const wrap = document.createElement('div');
      wrap.className = 'cat-board-wrap';

      const svg = document.createElementNS(SVG_NS, 'svg');
      svg.setAttribute('class', 'string-layer');

      const labelLayer = document.createElement('div');
      labelLayer.className = 'label-layer';

      const list = document.createElement('div');
      list.className = 'cat-board-list';

      categories.forEach(cat => {
        const row = document.createElement('div');
        row.className = 'cat-row';
        row.dataset.id = cat.id;
        if(cat.id === catLinkFromId) row.classList.add('linking-from');

        const dot = document.createElement('span');
        dot.className = 'cat-row-dot';
        dot.style.background = cat.color;

        const nameEl = document.createElement('span');
        nameEl.className = 'cat-row-name';
        nameEl.textContent = cat.name;

        row.appendChild(dot);
        row.appendChild(nameEl);

        row.addEventListener('click', () => {
          if(catConnectMode){
            handleCategoryConnectClick(cat.id, row);
          } else {
            categoryScreen = 'detail';
            categoryDetailId = cat.id;
            renderCategoryModal();
          }
        });

        list.appendChild(row);
      });

      wrap.appendChild(svg);
      wrap.appendChild(labelLayer);
      wrap.appendChild(list);
      categoryModalBox.appendChild(wrap);

      requestAnimationFrame(drawCategoryStrings);
    }

    const closeBtn = document.createElement('button');
    closeBtn.type = 'button';
    closeBtn.className = 'game-close-btn';
    closeBtn.textContent = '닫기';
    closeBtn.addEventListener('click', closeCategoryModal);
    categoryModalBox.appendChild(closeBtn);
  }

  function renderCategoryDetail(categoryId){
    const cat = categories.find(c => c.id === categoryId);
    if(!cat){
      categoryScreen = 'board';
      renderCategoryModal();
      return;
    }

    categoryModalBox.innerHTML = '';

    const head = document.createElement('div');
    head.className = 'cat-detail-head';
    const backBtn = document.createElement('button');
    backBtn.type = 'button';
    backBtn.className = 'cat-back-btn';
    backBtn.textContent = '← 목록으로';
    backBtn.addEventListener('click', () => {
      categoryScreen = 'board';
      renderCategoryModal();
    });
    head.appendChild(backBtn);
    categoryModalBox.appendChild(head);

    const title = document.createElement('div');
    title.className = 'cat-detail-title';
    const dot = document.createElement('span');
    dot.className = 'cat-row-dot';
    dot.style.background = cat.color;
    title.appendChild(dot);
    title.appendChild(document.createTextNode(cat.name));
    categoryModalBox.appendChild(title);

    const addRow = document.createElement('div');
    addRow.className = 'cat-add-new';
    const yearIn = document.createElement('input');
    yearIn.type = 'text';
    yearIn.className = 'cat-year-narrow';
    yearIn.placeholder = '연도';
    yearIn.inputMode = 'numeric';
    yearIn.setAttribute('pattern', '[0-9]*');
    yearIn.autocomplete = 'off';
    const eventIn = document.createElement('input');
    eventIn.type = 'text';
    eventIn.placeholder = '사건 이름';
    eventIn.autocomplete = 'off';
    const addBtn = document.createElement('button');
    addBtn.type = 'button';
    addBtn.textContent = '추가';
    addBtn.addEventListener('click', () => {
      addCategoryEvent(cat.id, yearIn.value, eventIn.value);
      yearIn.value = '';
      eventIn.value = '';
      yearIn.focus();
    });
    eventIn.addEventListener('keydown', (e) => { if(e.key === 'Enter'){ e.preventDefault(); addBtn.click(); } });
    addRow.appendChild(yearIn);
    addRow.appendChild(eventIn);
    addRow.appendChild(addBtn);
    categoryModalBox.appendChild(addRow);

    const catEvents = events.filter(ev => ev.categoryId === cat.id).sort((a,b) => a.year - b.year);
    if(catEvents.length === 0){
      const p = document.createElement('p');
      p.className = 'cat-detail-empty';
      p.textContent = '이 카테고리에 기록된 사건이 아직 없어요.';
      categoryModalBox.appendChild(p);
    } else {
      const list = document.createElement('div');
      list.className = 'cat-detail-list';
      catEvents.forEach(ev => {
        const item = document.createElement('div');
        item.className = 'cat-detail-item';

        const y = document.createElement('span');
        y.className = 'cat-detail-year';
        y.textContent = ev.year + '년';

        const n = document.createElement('span');
        n.className = 'cat-detail-name';
        n.textContent = ev.name;

        const del = document.createElement('button');
        del.type = 'button';
        del.className = 'cat-detail-del';
        del.textContent = '×';
        del.setAttribute('aria-label', ev.name + ' 삭제');
        del.addEventListener('click', () => deleteEvent(ev.id));

        item.appendChild(y);
        item.appendChild(n);
        item.appendChild(del);
        list.appendChild(item);
      });
      categoryModalBox.appendChild(list);
    }

    const deleteCatBtn = document.createElement('button');
    deleteCatBtn.type = 'button';
    deleteCatBtn.className = 'cat-delete-category-btn';
    deleteCatBtn.textContent = '카테고리 삭제';
    deleteCatBtn.addEventListener('click', () => deleteCategory(cat.id));
    categoryModalBox.appendChild(deleteCatBtn);

    const closeBtn = document.createElement('button');
    closeBtn.type = 'button';
    closeBtn.className = 'game-close-btn';
    closeBtn.textContent = '닫기';
    closeBtn.addEventListener('click', closeCategoryModal);
    categoryModalBox.appendChild(closeBtn);
  }

  function renderCategoryModal(){
    if(categoryScreen === 'detail' && categoryDetailId){
      renderCategoryDetail(categoryDetailId);
    } else {
      renderCategoryBoard();
    }
  }

  // ---------- 게임 ----------

  function getGamePools(){
    const pools = [];
    if(events.length >= 2){
      pools.push({ key: 'all', label: '전체', count: events.length, events: events, color: null });
    }
    categories.forEach(cat => {
      const evs = events.filter(e => e.categoryId === cat.id);
      if(evs.length >= 2){
        pools.push({ key: cat.id, label: cat.name, count: evs.length, events: evs, color: cat.color });
      }
    });
    return pools;
  }

  function openGame(){
    gameState = { screen: 'select' };
    gameOverlay.classList.add('show');
    renderGame();
  }

  function closeGame(){
    gameOverlay.classList.remove('show');
    gameState = null;
  }

  function startGameWithPool(poolEvents){
    const shuffled = shuffle(poolEvents);
    const questionCount = Math.min(shuffled.length, 8);
    const uniqueYears = [...new Set(poolEvents.map(e => e.year))];

    const questions = shuffled.slice(0, questionCount).map(ev => {
      const optionCount = Math.min(4, uniqueYears.length);
      const wrongPool = shuffle(uniqueYears.filter(y => y !== ev.year)).slice(0, optionCount - 1);
      const options = shuffle([ev.year, ...wrongPool]);
      return { event: ev, options: options, correctYear: ev.year };
    });

    gameState = {
      screen: 'question',
      questions: questions,
      currentIndex: 0,
      score: 0,
      answered: false,
      lastCorrect: null
    };
    renderGame();
  }

  function answerQuestion(selectedYear){
    if(gameState.answered) return;
    gameState.answered = true;
    const q = gameState.questions[gameState.currentIndex];
    gameState.selectedYear = selectedYear;
    gameState.lastCorrect = (selectedYear === q.correctYear);
    if(gameState.lastCorrect) gameState.score++;
    renderGame();
  }

  function nextQuestion(){
    gameState.currentIndex++;
    gameState.answered = false;
    gameState.lastCorrect = null;
    gameState.selectedYear = null;
    if(gameState.currentIndex >= gameState.questions.length){
      gameState.screen = 'result';
    }
    renderGame();
  }

  function renderGameSelect(){
    gameModal.innerHTML = '';
    const h3 = document.createElement('h3');
    h3.textContent = '어떤 범위로 풀어볼까요?';
    gameModal.appendChild(h3);

    const pools = getGamePools();
    if(pools.length === 0){
      const p = document.createElement('p');
      p.className = 'game-empty';
      p.textContent = '게임을 하려면 사건이 최소 2개 이상 필요해요.';
      gameModal.appendChild(p);
    } else {
      const list = document.createElement('div');
      list.className = 'game-mode-list';
      pools.forEach(pool => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'game-mode-btn';
        const dot = document.createElement('span');
        dot.className = 'mode-dot';
        if(pool.color) dot.style.background = pool.color;
        const label = document.createElement('span');
        label.className = 'mode-label';
        label.textContent = pool.label;
        const count = document.createElement('span');
        count.className = 'mode-count';
        count.textContent = pool.count + '개';
        btn.appendChild(dot);
        btn.appendChild(label);
        btn.appendChild(count);
        btn.addEventListener('click', () => startGameWithPool(pool.events));
        list.appendChild(btn);
      });
      gameModal.appendChild(list);
    }

    const closeBtn = document.createElement('button');
    closeBtn.type = 'button';
    closeBtn.className = 'game-close-btn';
    closeBtn.textContent = '닫기';
    closeBtn.addEventListener('click', closeGame);
    gameModal.appendChild(closeBtn);
  }

  function renderGameQuestion(){
    gameModal.innerHTML = '';
    const q = gameState.questions[gameState.currentIndex];

    const progress = document.createElement('div');
    progress.className = 'game-progress';
    progress.textContent = (gameState.currentIndex + 1) + ' / ' + gameState.questions.length + ' 문제';
    gameModal.appendChild(progress);

    const qCard = document.createElement('div');
    qCard.className = 'game-question-card';
    qCard.textContent = q.event.name;
    gameModal.appendChild(qCard);

    const options = document.createElement('div');
    options.className = 'game-options';
    q.options.forEach(year => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'game-option-btn';
      btn.textContent = year + '년';
      if(gameState.answered){
        btn.disabled = true;
        if(year === q.correctYear) btn.classList.add('correct');
        else if(year === gameState.selectedYear) btn.classList.add('wrong');
      }
      btn.addEventListener('click', () => answerQuestion(year));
      options.appendChild(btn);
    });
    gameModal.appendChild(options);

    const feedback = document.createElement('div');
    feedback.className = 'game-feedback';
    if(gameState.answered){
      if(gameState.lastCorrect){
        feedback.classList.add('correct');
        feedback.textContent = '맞았어요';
      } else {
        feedback.classList.add('wrong');
        feedback.textContent = '틀렸어요 — 정답은 ' + q.correctYear + '년';
      }
    }
    gameModal.appendChild(feedback);

    if(gameState.answered){
      const nextBtn = document.createElement('button');
      nextBtn.type = 'button';
      nextBtn.className = 'game-next-btn';
      nextBtn.textContent = (gameState.currentIndex + 1 >= gameState.questions.length) ? '결과 보기' : '다음 문제';
      nextBtn.addEventListener('click', nextQuestion);
      gameModal.appendChild(nextBtn);
    }

    const closeBtn = document.createElement('button');
    closeBtn.type = 'button';
    closeBtn.className = 'game-close-btn';
    closeBtn.textContent = '그만하기';
    closeBtn.addEventListener('click', closeGame);
    gameModal.appendChild(closeBtn);
  }

  function renderGameResult(){
    gameModal.innerHTML = '';
    const h3 = document.createElement('h3');
    h3.textContent = '결과';
    gameModal.appendChild(h3);

    const score = document.createElement('div');
    score.className = 'game-score';
    score.textContent = gameState.score + ' / ' + gameState.questions.length;
    gameModal.appendChild(score);

    const sub = document.createElement('div');
    sub.className = 'game-score-sub';
    sub.textContent = gameState.questions.length + '문제 중 ' + gameState.score + '개를 맞혔어요';
    gameModal.appendChild(sub);

    const againBtn = document.createElement('button');
    againBtn.type = 'button';
    againBtn.className = 'game-again-btn';
    againBtn.textContent = '다른 범위로 다시 하기';
    againBtn.addEventListener('click', () => { gameState = { screen: 'select' }; renderGame(); });
    gameModal.appendChild(againBtn);

    const closeBtn = document.createElement('button');
    closeBtn.type = 'button';
    closeBtn.className = 'game-close-btn';
    closeBtn.textContent = '닫기';
    closeBtn.addEventListener('click', closeGame);
    gameModal.appendChild(closeBtn);
  }

  function renderGame(){
    if(!gameState) return;
    if(gameState.screen === 'select') renderGameSelect();
    else if(gameState.screen === 'question') renderGameQuestion();
    else if(gameState.screen === 'result') renderGameResult();
  }

  loadData();
  render();
})();
</script>
</body>
</html>
